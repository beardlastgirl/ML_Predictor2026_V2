name: CI Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest tests/ -v

      - name: Run pip-audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      - name: Check for tracked artifacts
        run: |
          if git ls-files | grep -E "(catboost_info/|Reporte/|Prediccion.*\.txt|feature_importance_.*\.png|\.pdf$)"; then
            echo "ERROR: Tracked artifacts found that should be in .gitignore"
            exit 1
          fi